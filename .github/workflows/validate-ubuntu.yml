name: Validate Jekyll on newer Ubuntu runners

on:
  push:
    branches: ["verify/ubuntu-runners-20261110"]

permissions:
  contents: read
  pages: read

jobs:
  # Build job
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.338.0
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          name: pages-validation-${{ matrix.os }}

